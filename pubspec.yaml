name: dayli
description: Günlük planlama ve alışkanlık takibi.
publish_to: none
version: 1.0.0+2

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_localizations:
    sdk: flutter
  flutter_timezone: ^5.1.0
  google_mobile_ads: ^9.1.0
  path_provider: ^2.1.6
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/branding/dayli_logo.png
    - assets/branding/rutin-defterim-splash.png
    - assets/branding/rutin-defterim-ic-logo.png

flutter_native_splash:
  color: "#F9F9F2"
  image: assets/branding/rutin-defterim-splash.png
  ios_content_mode: scaleAspectFill
  android: false
  web: false